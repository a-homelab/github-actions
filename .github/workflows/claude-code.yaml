name: Claude Code

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Claude Code
        run: |
          bun install -g @anthropic-ai/claude-code
          echo "$HOME/.bun/bin" >> "${GITHUB_PATH}"
          ls -la "$HOME/.bun/bin/"
          echo "PATH will be: $HOME/.bun/bin:$PATH"
          which claude || true

      - name: Run Claude Code
        run: |
          which claude || true
          echo "PATH: $PATH"
          claude -p "Hello! Starting daily session."
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
