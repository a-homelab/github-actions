name: Docker Build and Push

on:
  workflow_call:
    inputs:
      service-name:
        description: Canonical service name. Must be unique across all services.
        required: true
        type: string

      registries:
        description: |
          JSON-formated list of registries to use. Valid values are: `ecr`,`ghcr`. Defaults to `["ghcr"]`.
        default: '["ghcr"]'
        required: false
        type: string

      image-namespace:
        description: |
          Namespace inserted between the registry host and the service name,
          e.g. `a-homelab` yields `ghcr.io/a-homelab/<service-name>`. When
          unset, defaults to the owner of the repository running the workflow.
          Pass `/` to push directly under the registry root.
        default: ""
        required: false
        type: string

      context:
        description: Build context
        default: "."
        required: false
        type: string

      file:
        description: Path to Dockerfile
        default: "./Dockerfile"
        required: false
        type: string

      build-args:
        description: List of Docker build args
        required: false
        type: string

      target:
        description: Target stage
        required: false
        type: string

      platforms:
        description: |
          JSON-formatted list of container image target platforms. Defaults to `["linux/amd64"]`. See: https://docs.docker.com/build/building/multi-platform/ for valid values.
        default: '["linux/amd64"]'
        required: false
        type: string

      push:
        description: |
          Whether to push the built image. Set to `false` to validate the
          Dockerfile (build-only). When `false`, the digest export, digest
          artifact upload, and the manifest-merge job are skipped. The
          Trivy scan still runs against the locally-loaded image.

          Use single-platform input (`platforms: '["linux/amd64"]'`) for
          validation runs to avoid wasted multi-platform builds.
        default: true
        required: false
        type: boolean

      tag-latest:
        description: Whether to tag and push latest
        default: true
        required: false
        type: boolean

      tags:
        description: Custom tags for the docker image
        required: false
        type: string

      submodules:
        description: Whether to checkout submodules
        default: false
        required: false
        type: boolean

      # https://docs.docker.com/engine/reference/commandline/buildx_build/#cache-from
      cache-from:
        description: Cache from
        required: false
        type: string

      # https://docs.docker.com/engine/reference/commandline/buildx_build/#cache-to
      cache-to:
        description: Cache to
        required: false
        type: string

      enable-cache-mounts:
        description: Persist BuildKit RUN --mount=type=cache mounts across builds. Disabled by default due to slow post-build tar operations.
        default: false
        required: false
        type: boolean

      allow-fail:
        description: Wether to allow the workflow to continue if the job fails
        default: false
        required: false
        type: boolean

      runs-on:
        description: Runner tag to run this workflow on
        default: ubuntu-latest
        required: false
        type: string

      runs-on-linux-amd64:
        description: Runner tag to run this workflow on for linux/amd64
        default: ubuntu-latest
        required: false
        type: string

      runs-on-linux-arm64:
        description: Runner tag to run this workflow on for linux/arm64
        default: ubuntu-24.04-arm
        required: false
        type: string

    outputs:
      registry:
        description: Container registry
        value: ${{ jobs.build-push.outputs.registry }}
      short-sha:
        description: Short SHA that can be used as a rolling tag
        value: ${{ jobs.build-push.outputs.short-sha }}
      image-with-sha:
        description: Full image name with SHA
        value: ${{ jobs.build-push.outputs.image-with-sha }}
      repository:
        description: Container repository
        value: ${{ jobs.build-push.outputs.repository }}
      digest:
        description: Image digest
        value: ${{ jobs.build-push.outputs.digest }}
      image-ref:
        description: Full image ref with digest
        value: ${{ jobs.build-push.outputs.image-ref }}

# Permissions for Github OIDC -> AWS, and for pushing packages to ghcr.
# https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#adding-permissions-settings
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  compute-tags:
    name: Compute image tags
    runs-on: ${{ inputs.runs-on }}
    outputs:
      images: ${{ steps.compute-tags.outputs.images }}
      tags: ${{ steps.compute-tags.outputs.tags }}
    steps:
      - name: Compute tags
        id: compute-tags
        uses: a-homelab/github-actions/actions/compute-image-tags@main
        with:
          service-name: ${{ inputs.service-name }}
          registries: ${{ inputs.registries }}
          image-namespace: ${{ inputs.image-namespace }}
          tag-latest: ${{ inputs.tag-latest }}
          tags: ${{ inputs.tags }}

  generate-artifacts-suffix:
    name: Generate unique suffix for artifacts within the matrix run
    runs-on: ${{ inputs.runs-on }}
    outputs:
      suffix: ${{ steps.generate-suffix.outputs.suffix }}
    steps:
      - name: Generate suffix
        id: generate-suffix
        run: |-
          echo "suffix="$(dd bs=512 if=/dev/urandom count=1 2>/dev/null | LC_ALL=C tr -dc 'a-zA-Z0-9' | head -c 7)"" >> "${GITHUB_OUTPUT}"

  build-push:
    name: Docker Build and Push ${{ inputs.service-name }} ${{ matrix.platform }}
    needs:
      - compute-tags
      - generate-artifacts-suffix
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ inputs.allow-fail }}
    # Pair each requested platform with its native runner without a separate
    # matrix-computation job: expand the full platform x runner cross product,
    # then exclude every mismatched pair plus any platform the caller did not
    # ask for.
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        runs-on:
          - ${{ inputs.runs-on-linux-amd64 }}
          - ${{ inputs.runs-on-linux-arm64 }}
        isAmd64:
          - ${{ contains(fromJson(inputs.platforms), 'linux/amd64') }}
        isArm64:
          - ${{ contains(fromJson(inputs.platforms), 'linux/arm64') }}
        exclude:
          - isAmd64: false
            platform: linux/amd64
          - isArm64: false
            platform: linux/arm64
          - platform: linux/amd64
            runs-on: ${{ inputs.runs-on-linux-arm64 }}
          - platform: linux/arm64
            runs-on: ${{ inputs.runs-on-linux-amd64 }}
    outputs:
      registry: ${{ steps.build-push.outputs.registry }}
      short-sha: ${{ steps.build-push.outputs.short-sha }}
      image-with-sha: ${{ steps.build-push.outputs.image-with-sha }}
      repository: ${{ steps.build-push.outputs.repository }}
      digest: ${{ steps.build-push.outputs.digest }}
      image-ref: ${{ steps.build-push.outputs.image-ref }}
    steps:
      - name: Create Github App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: ${{ inputs.submodules }}

      - name: Build and push container
        id: build-push
        uses: a-homelab/github-actions/actions/build-push-container@main
        with:
          service-name: ${{ inputs.service-name }}
          registries: ${{ inputs.registries }}
          image-namespace: ${{ inputs.image-namespace }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          tag-latest: ${{ inputs.tag-latest }}
          tags: ${{ needs.compute-tags.outputs.tags }}
          digest-only: ${{ strategy.job-total > 1 && 'true' || 'false' }}
          artifacts-suffix: ${{ needs.generate-artifacts-suffix.outputs.suffix }}
          enable-cache-mounts: ${{ inputs.enable-cache-mounts }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}
          release-bot-github-app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          release-bot-github-app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    name: Merge image manifests ${{ inputs.service-name }}
    # Validation runs (push=false) don't push platform images, so there's
    # nothing to assemble into a manifest list.
    if: ${{ inputs.push }}
    runs-on: ${{ inputs.runs-on }}
    continue-on-error: ${{ inputs.allow-fail }}
    needs:
      - compute-tags
      - generate-artifacts-suffix
      - build-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: 'digests-*-${{ needs.generate-artifacts-suffix.outputs.suffix }}'
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ECR
        if: contains(fromJson(inputs.registries), 'ecr')
        id: login-ecr
        uses: a-homelab/github-actions/actions/login-ecr@main

      - name: Log in to ghcr
        if: contains(fromJson(inputs.registries), 'ghcr')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags_args=()
          while IFS= read -r tag
          do
            if [[ "${tag}" == '' ]]
            then
              continue
            fi
            tags_args+=("-t")
            tags_args+=("${tag}")
          done <<< "${TAGS}"

          echo "command: docker buildx imagetools create ${tags_args[@]} $(printf "${REPOSITORY}@sha256:%s " *)"

          docker buildx imagetools create ${tags_args[@]} \
            $(printf "${REPOSITORY}@sha256:%s " *)
        env:
          TAGS: ${{ needs.compute-tags.outputs.tags }}
          REPOSITORY: ${{ needs.build-push.outputs.repository }}

      - name: Inspect image
        run: |
          while IFS= read -r tag
          do
            if [[ "${tag}" == '' ]]
            then
              continue
            fi
            docker buildx imagetools inspect "${tag}"
          done <<< "${TAGS}"
        env:
          TAGS: ${{ needs.compute-tags.outputs.tags }}

      - name: Write job summary
        run: |
          echo "## Container Images Pushed" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Image |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| ----- |" >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r tag
          do
            if [[ "${tag}" == '' ]]
            then
              continue
            fi
            echo "| \`${tag}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"
        env:
          TAGS: ${{ needs.compute-tags.outputs.tags }}
